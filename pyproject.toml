[project]
name = "upsong"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "somacci", email = "ldhbom@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
